<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creations of the Ill Minded</title>
<link rel="canonical" href="https://www.creationsoftheillminded.com/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font:18px/1.5 system-ui,sans-serif}a{color:inherit}</style>
<noscript><meta http-equiv="refresh" content="0; url=https://www.creationsoftheillminded.com/"></noscript>
<script>
// Until old DNS caches expire, www can bounce back here; redirect at most once per 5 s so it can't loop.
(function () {
  var last = 0;
  try { last = +sessionStorage.getItem("r") || 0; sessionStorage.setItem("r", Date.now()); } catch (e) {}
  if (Date.now() - last > 5000)
    location.replace("https://www.creationsoftheillminded.com" + location.pathname.replace(/index\.html$/, "") + location.search + location.hash);
})();
</script>
</head>
<body><p><a href="https://www.creationsoftheillminded.com/">Creations of the Ill Minded is at www.creationsoftheillminded.com</a></p></body>
